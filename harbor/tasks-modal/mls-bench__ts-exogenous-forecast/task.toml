schema_version = "1.1"

# reward_type is one of binary | bounded_continuous | unbounded_continuous.
# Every MLS-Bench trial reward is a geometric mean of per-setting scores, each
# normalised into [0, 1] by tests/meta/score_spec.py (bounded_power / sigmoid,
# both clipped to [0, 1]) and floored at 0.01, so the trial reward lies in
# [0, 1] -> bounded_continuous. 0.0 is reserved for an unscored run.
reward_type = "bounded_continuous"

[task]
name = "mls-bench/ts-exogenous-forecast"
description = "MLS-Bench: ts-exogenous-forecast"
authors = [{ name = "MLS-Bench authors" }]
keywords = ["ml-research"]

[metadata]
difficulty = "hard"
category = "ml-research"
difficulty_explanation = "MLS-Bench algorithmic-research task. See instruction.md for editable surface, eval scripts, and scoring contract."
mls_bench_task_id = "ts-exogenous-forecast"
mls_bench_package = "Time-Series-Library"

[agent]
timeout_sec = 18000

[verifier]
timeout_sec = 13080

[environment]
# Build the per-task image from environment/Dockerfile (which FROMs the
# per-package harbor base). Setting docker_image here would make Harbor skip
# the Dockerfile (see harbor/environments/docker/docker.py:466), which would
# also skip the per-task mid_edit scaffolding the Dockerfile applies.
os = "linux"
build_timeout_sec = 7200
cpus = 8
memory_mb = 32768
storage_mb = 61440
gpus = 1
# The trial has egress by default. A task that wants its trial sealed declares
# "harbor_allow_internet": false in its config.json -- nothing in a trial needs
# the network, since every dataset, weight, package and cache is baked in the
# image BUILD (a separate Docker phase, unaffected by this flag). Sealing costs
# the in-container-agent case (network_mode: none covers the AGENT phase too)
# and any GPU provider that needs egress; see mls_bench.adapter._allow_internet.
allow_internet = true
