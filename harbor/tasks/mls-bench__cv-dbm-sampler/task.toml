schema_version = "1.1"

[task]
name = "mls-bench/cv-dbm-sampler"
description = "MLS-Bench: cv-dbm-sampler"
authors = [{ name = "MLS-Bench authors", email = "bohan22@stanford.edu" }]
keywords = ["ml-research", "computer-vision"]

[metadata]
difficulty = "hard"
category = "ml-research"
difficulty_explanation = "MLS-Bench algorithmic-research task. See instruction.md for editable surface, eval scripts, and scoring contract."
mls_bench_task_id = "cv-dbm-sampler"
mls_bench_package = "dbim-codebase"

[agent]
timeout_sec = 18000

[verifier]
timeout_sec = 30960

[environment]
# Build the per-task image from environment/Dockerfile (which FROMs the
# per-package harbor base). Setting docker_image here would make Harbor skip
# the Dockerfile (see harbor/environments/docker/docker.py:466), which would
# also skip the per-task mid_edit scaffolding the Dockerfile applies.
os = "linux"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 61440
# Capped at 8 GPUs (MAX_PARALLEL_GPUS): running every (test_cmd, seed) eval
# job in parallel would occupy 12 GPUs, more than a typical Harbor GPU host
# has. The verifier instead runs them as 2 sequential waves of at most 8
# GPUs, and [verifier].timeout_sec above budgets wall clock for every wave.
gpus = 8
allow_internet = true
