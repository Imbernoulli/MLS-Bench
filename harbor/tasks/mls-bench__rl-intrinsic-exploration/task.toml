schema_version = "1.1"

[task]
name = "mls-bench/rl-intrinsic-exploration"
description = "MLS-Bench: rl-intrinsic-exploration"
authors = [{ name = "MLS-Bench authors", email = "bohan22@stanford.edu" }]
keywords = ["ml-research", "reinforcement-learning"]

[metadata]
difficulty = "hard"
category = "ml-research"
difficulty_explanation = "MLS-Bench algorithmic-research task. See instruction.md for editable surface, eval scripts, and scoring contract."
mls_bench_task_id = "rl-intrinsic-exploration"
mls_bench_package = "cleanrl"

[agent]
timeout_sec = 18000

[verifier]
timeout_sec = 90180

[environment]
# Build the per-task image from environment/Dockerfile (which FROMs the
# per-package harbor base). Setting docker_image here would make Harbor skip
# the Dockerfile (see harbor/environments/docker/docker.py:466), which would
# also skip the per-task mid_edit scaffolding the Dockerfile applies.
os = "linux"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 61440
# Reserves 3 GPUs: running every (test_cmd, seed) eval job in parallel would
# occupy 9, above the MAX_PARALLEL_GPUS=8 cap. The verifier runs them as 3
# sequential waves instead. 3 is the widest reservation at or below the cap
# that every wave fills completely — a wider one would idle GPUs in the
# final wave for no gain in wall clock. [verifier].timeout_sec above budgets
# wall clock for every wave.
gpus = 3
allow_internet = true
