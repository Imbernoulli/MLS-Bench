schema_version = "1.1"

[task]
name = "mls-bench/graph-graph-classification"
description = "MLS-Bench: graph-graph-classification"
authors = [{ name = "MLS-Bench authors", email = "bohan22@stanford.edu" }]
keywords = ["ml-research"]

[metadata]
difficulty = "hard"
category = "ml-research"
difficulty_explanation = "MLS-Bench algorithmic-research task. See instruction.md for editable surface, eval scripts, and scoring contract."
mls_bench_task_id = "graph-graph-classification"
mls_bench_package = "pytorch-geometric"

[agent]
timeout_sec = 18000

[verifier]
timeout_sec = 15600

[environment]
# Build the per-task image from environment/Dockerfile (which FROMs the
# per-package harbor base). Setting docker_image here would make Harbor skip
# the Dockerfile (see harbor/environments/docker/docker.py:466), which would
# also skip the per-task mid_edit scaffolding the Dockerfile applies.
os = "linux"
build_timeout_sec = 7200
cpus = 16
memory_mb = 65536
storage_mb = 61440
gpus = 1
# The images pin CUDA wheels built for Hopper (sm_90); a provider that
# also offers Blackwell cards (Daytona does) must not place the task there.
gpu_types = ["h100"]
allow_internet = true
